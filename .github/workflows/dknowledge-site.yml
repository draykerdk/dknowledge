name: Dknowledger site

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  static-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify generated repository catalog
        run: node tools/build-catalog.js --check
      - name: Verify page contracts
        run: node tools/site-check.js

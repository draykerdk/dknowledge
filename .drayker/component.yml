schema_version: 1
component:
  id: dknowledge
  name: Dknowledge
  layer: KNOWLEDGE
  artifact_type: knowledge-base
  problem: Keep the public vision, architecture, papers and historical roadmaps of Drayker connected to their sources.
  scope:
    - Public documentation and knowledge history for Drayker and Dk.
    - Clear distinction between current orientation and historical material.
    - The E.C.H. Triad (Expansion, Complexity, Harmony) across scales, grounded in complex systems dynamics and scale invariance, with Harmony capable of reconstructing the model.
    - Anonymous federated learning through patterns or model updates with depersonalized metadata, with independent validation increasing global weight.
    - Deliberate, authorized sharing of knowledge or narrative with provenance and permissions, kept distinct from federated learning.
    - "Contextual reputation of data and relations: trust levels and metadata that evolve with use and with results, as a base layer shared with UIDs and functions."
    - "Dknowledge as the same pattern at every scale (personal, project and organization, global), the global one being the junction of all."
    - "Decision records: data and rules used, component versions, proposals considered, authorizations and actions."
  non_scope:
    - "Members' personal Dknowledge or any private knowledge base: this repository holds public knowledge only."
    - "An operational ontology, oracle or distributed data platform today; that is the designed form of Dknowledge, not yet built."
  dependencies:
    - dk
    - dfmp
    - pap
  implementation:
    level: operational
    scope: The public documentation site is deployed; the broader knowledge-system vision is not implemented.
    evidence:
      - type: deployment
        ref: https://dknowledge.drayker.org
      - type: document
        ref: README.md
  risks:
    - Historical roadmaps can be mistaken for current commitments.
    - The long-term knowledge-system vision can be confused with the deployed documentation site.
    - Anonymous or depersonalized learning can be overstated before re-identification safeguards are tested.
  contributions:
    availability: open
    entrypoint: https://github.com/draykerdk/dknowledge/issues
  source_of_truth:
    repository: https://github.com/draykerdk/dknowledge
    path: README.md
  last_reviewed: "2026-10-21"

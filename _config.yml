# The Drayker documentation theme — one layout shared by every *.drayker.org site.
# Source: https://github.com/draykerdk/drayker-theme
remote_theme: draykerdk/drayker-theme

plugins:
  - jekyll-remote-theme
  - jekyll-optional-front-matter

title: "Dknowledge"
description: "The Drayker and Dk knowledge base — papers by main project, the roadmap, and how to collaborate."

dk_kicker: "Knowledge base"
dk_subdomain: "dknowledge.drayker.org"
dk_repo: "https://github.com/draykerdk/dknowledge"

defaults:
  - scope:
      path: ""
    values:
      layout: default
